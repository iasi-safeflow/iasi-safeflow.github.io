# Builds the Expo web export from mobile/ and publishes it to GitHub Pages.
# Requires the repository variable EXPO_PUBLIC_API_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://iasi-safeflow-api.onrender.com. It is baked into the static bundle, so it is public, not a secret.
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Check API URL is configured
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Set the repository variable EXPO_PUBLIC_API_URL to the backend URL."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
