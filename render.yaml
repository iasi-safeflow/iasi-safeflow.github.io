# Render Blueprint for the SafeFlow API (free plan). Secrets are never stored here:
#   - SAFEFLOW_SECRET_KEY is generated by Render on first deploy.
#   - DEMO_REVIEWER_PASSWORD and SAFEFLOW_ALLOWED_ORIGINS are entered in the Render dashboard (sync: false).
# Free instances sleep when idle and have no persistent disk: the SQLite file is wiped on restart/redeploy,
# after which the simulated demo dataset is seeded again.
services:
  - type: web
    name: iasi-safeflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SAFEFLOW_SECRET_KEY
        generateValue: true
      - key: DEMO_REVIEWER_EMAIL
        value: reviewer@example.com
      - key: DEMO_REVIEWER_PASSWORD
        sync: false
      - key: SAFEFLOW_ALLOWED_ORIGINS
        sync: false # https://iasi-safeflow.github.io  (origin only, no path)
      - key: SAFEFLOW_SEED_DEMO_DATA
        value: "1"
