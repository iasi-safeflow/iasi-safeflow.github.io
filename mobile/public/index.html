<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Installable web app (PWA): manifest, icons and the service worker that lets the app open offline. -->
    <meta name="description" content="Iași SafeFlow: semnalare non-urgentă a problemelor de siguranță rutieră (prototip, date simulate). Pentru urgențe sunați la 112." />
    <!-- Colours match background in src/theme.ts (light / dark). -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F3FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16131F" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Same id as sw.js, set by scripts/postexport-web.js. -->
    <meta name="safeflow-build" content="__BUILD_ID__" />
    <script>
      if ('serviceWorker' in navigator) {
        // A newly activated service worker announces its build. If it isn't this page's build, this page is an older
        // version that is still open, so offer a reload (not a forced one: it would lose a half-written report).
        var pageBuild = document.querySelector('meta[name="safeflow-build"]').content;
        navigator.serviceWorker.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'safeflow-build' && e.data.build !== pageBuild) showUpdateBanner();
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              // An installed app is usually resumed from the background rather than reloaded, so look for a new
              // version each time it comes back to the foreground.
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') reg.update().catch(function () {});
              });
            })
            .catch(function () {
              /* The app still works without offline support. */
            });
        });
      }
      function showUpdateBanner() {
        if (document.getElementById('sf-update')) return;
        var banner = document.createElement('div');
        banner.id = 'sf-update';
        banner.setAttribute('role', 'status');
        banner.innerHTML =
          '<span>Este disponibilă o versiune nouă a aplicației.</span>' +
          '<button type="button" id="sf-update-reload">Reîncarcă</button>' +
          '<button type="button" id="sf-update-close" aria-label="Închide">×</button>';
        document.body.appendChild(banner);
        document.getElementById('sf-update-reload').onclick = function () {
          location.reload();
        };
        document.getElementById('sf-update-close').onclick = function () {
          banner.remove();
        };
      }
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background: #F5F3FB;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #16131F;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* "New version" banner (script above). Primary purple with white text reads in both themes (6.7:1). */
      #sf-update {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        width: max-content;
        max-width: calc(100% - 32px);
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 8px 8px 16px;
        border-radius: 16px;
        background: #6941C6;
        color: #FFFFFF;
        font: 600 14px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      }
      #sf-update button {
        min-height: 40px;
        border: 0;
        border-radius: 12px;
        background: #FFFFFF;
        color: #53389E;
        font: inherit;
        padding: 0 14px;
        cursor: pointer;
      }
      #sf-update #sf-update-close {
        background: transparent;
        color: #FFFFFF;
        font-size: 20px;
        padding: 0 10px;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
